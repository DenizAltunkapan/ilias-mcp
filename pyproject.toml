[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ilias-mcp"
version = "0.1.0"
description = "MCP server for listing ILIAS courses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9.0,<2.0.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
  "python-dotenv>=1.0.0",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=9.0.0",
  "ruff>=0.14.0",
]

[project.scripts]
ilias-mcp = "mcp_app.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "domain*", "services*", "mcp_app*"]
